name: Code Quality & Testing

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2, 8.3]
        laravel: [12.*, 13.*]
        exclude:
          - php: 8.2
            laravel: 13.*

    name: P-${{ matrix.php }} - L-${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, openssl
          coverage: none

      - name: Install dependencies and Larastan dynamically
        run: |
          case "${{ matrix.laravel }}" in
            12.*)
              composer require --dev "larastan/larastan:^3.0" "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:^10.0" --no-update
              ;;
            13.*)
              composer require --dev "larastan/larastan:^3.0" "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:^11.0" --no-update
              ;;
          esac
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute Static Analysis (PHPStan)
        run: |
          chmod +x vendor/bin/phpstan
          vendor/bin/phpstan analyse

      - name: Run Tests
        run: |
          chmod +x vendor/bin/phpunit
          vendor/bin/phpunit
